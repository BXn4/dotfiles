log_level = "warn"
outputs = { Targets = ["DP-1"] }
position = "Top"
app_launcher_cmd = "wofi -show drun"
region = "en-HU"

[modules]
left = [ [ "Workspaces", "Tray" ] ]
center = [ "MediaPlayer"]
right = ["Tempo", [ "Privacy", "Settings", "Notifications"] ]

[workspaces]
enable_workspace_filling = true

[tempo]
clock_format = "%a %d %b %R"
weather_location = { City = "Szeged" }
weather_indicator = "IconAndTemperature"
wind_speed_unit = "Kmh"

[[CustomModule]]
name = "Notifications"
icon = "󰍥"
command = "swaync-client --toggle-panel"

[settings]
lock_cmd = "playerctl --all-players pause; nixGL hyprlock &"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueberry"

[appearance]
text_color = "#c6d0f5"
workspace_colors = [ "#8caaee", "#8caaee" ]

[appearance.bar]
surface = "solid"
scale_factor = 1

[appearance.primary_color]
base = "#8caaee"
text = "#c6d0f5"

[appearance.success_color]
base = "#8caaee"
text = "#c6d0f5"

[appearance.danger_color]
base = "#8caaee"
weak = "#e5c890"

[appearance.background_color]
base = "#303446"
weak = "#292c3c"
strong = "#232634"

[appearance.secondary_color]
base = "#303446"
